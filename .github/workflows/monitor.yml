name: CGV Centum Odyssey Monitor v2.2

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Diagnostic only (no alert); read a known-open IMAX date"
        required: true
        default: true
        type: boolean
      diagnostic_date:
        description: "Diagnostic date (YYYYMMDD)"
        required: true
        default: "20260813"
        type: string
      test_notification:
        description: "Create only a GitHub Issue push test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: cgv-centum-odyssey-monitor-v2
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Diagnose Chrome
        run: |
          which google-chrome || which google-chrome-stable || which chromium || true
          google-chrome --version || google-chrome-stable --version || chromium --version || true

      - name: Monitor CGV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSIGNEE: lsy0034-sketch
          TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification || 'false' }}
          DIAGNOSTIC_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only || 'false' }}
          DIAGNOSTIC_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_date || '20260813' }}
        run: node monitor.js
